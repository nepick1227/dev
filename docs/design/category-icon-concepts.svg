<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#17191C" flood-opacity="0.07"/>
    </filter>
    <style>
      text { font-family: "Pretendard Variable", Pretendard, Arial, sans-serif; fill: #17191C; }
      .body { font-size: 14px; font-weight: 600; fill: #6E7379; }
      .caption { font-size: 12px; font-weight: 600; fill: #8A9097; }
      .label { font-size: 15px; font-weight: 800; }
      .icon { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    </style>

    <!-- A: 가이드 기본형 -->
    <symbol id="a-food" viewBox="0 0 24 24">
      <g class="icon"><path d="M5 2v7.2c0 1.7 1.1 2.8 2.6 2.8S10 10.9 10 9.2V2M7.5 2v20M14.5 2v20M20 2c0 4.2-3 6-3 10v10"/></g>
    </symbol>
    <symbol id="a-cafe" viewBox="0 0 24 24">
      <g class="icon"><path d="M4 9h14v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9Z"/><path d="M18 10h1.5a2.5 2.5 0 0 1 0 5H18M8 4.5c-.8.6-.8 1.4 0 2M12 4.5c-.8.6-.8 1.4 0 2"/></g>
    </symbol>

    <!-- B: 네픽 사선형 -->
    <symbol id="b-food" viewBox="0 0 24 24">
      <g class="icon"><circle cx="12" cy="12" r="6.2"/><path d="M4 3v5.5a2 2 0 0 0 4 0V3M6 3v18M20 3c0 3.5-2.5 5-2.5 8v10"/></g>
      <path d="m10.7 9.7 3.6 3.6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    </symbol>
    <symbol id="b-cafe" viewBox="0 0 24 24">
      <g class="icon"><path d="M4 9.5h13.5v4.2a5.3 5.3 0 0 1-5.3 5.3H9.3A5.3 5.3 0 0 1 4 13.7V9.5Z"/><path d="M17.5 10.5h1.8a2.4 2.4 0 0 1 0 4.8h-2M7 5.2l2-2M11 6l2.8-2.8"/></g>
      <path d="m10.2 12 2.9 2.9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    </symbol>

    <!-- C: 장소 핀형 -->
    <symbol id="c-food" viewBox="0 0 24 24">
      <g class="icon"><path d="M19 10.2c0 5.1-7 11-7 11s-7-5.9-7-11a7 7 0 1 1 14 0Z"/><path d="M8.3 8v3.2c0 1 .7 1.7 1.7 1.7s1.7-.7 1.7-1.7V8M10 8v6M15.2 8c0 1.8-1.3 2.7-1.3 4.2V14"/></g>
    </symbol>
    <symbol id="c-cafe" viewBox="0 0 24 24">
      <g class="icon"><path d="M19 10.2c0 5.1-7 11-7 11s-7-5.9-7-11a7 7 0 1 1 14 0Z"/><path d="M8.2 9.3h7.2v2.2a2.8 2.8 0 0 1-2.8 2.8H11a2.8 2.8 0 0 1-2.8-2.8V9.3Z"/><path d="M15.4 10h.7a1.3 1.3 0 0 1 0 2.6h-.8M10.4 6.7c-.5.4-.5.9 0 1.3"/></g>
    </symbol>
