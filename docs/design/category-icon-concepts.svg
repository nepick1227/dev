    <text x="24" y="61" class="label">균형형</text>
    <text x="24" y="84" class="caption">가이드 원형을 정돈한 기본안</text>
    <rect x="215" y="28" width="72" height="72" rx="18" fill="#FDECEA"/>
    <use href="#a-food" x="235" y="48" width="32" height="32" color="#D32F2F"/>
    <rect x="303" y="28" width="72" height="72" rx="18" fill="#F6F7F9"/>
    <use href="#a-cafe" x="323" y="48" width="32" height="32" color="#3A3F45"/>
    <g transform="translate(407 36)"><rect width="120" height="36" rx="18" fill="#D32F2F"/><use href="#a-food" x="14" y="8" width="20" height="20" color="#fff"/><text x="42" y="24" font-size="14" font-weight="700" fill="#fff">음식점</text></g>
    <g transform="translate(539 36)"><rect width="104" height="36" rx="18" fill="#fff" stroke="#E6E8EB" stroke-width="1.5"/><use href="#a-cafe" x="14" y="8" width="20" height="20" color="#3A3F45"/><text x="42" y="24" font-size="14" font-weight="600" fill="#3A3F45">카페</text></g>
    <use href="#a-food" x="700" y="39" width="24" height="24" color="#3A3F45"/><use href="#a-cafe" x="742" y="39" width="24" height="24" color="#3A3F45"/>
    <text x="700" y="91" class="caption">가독성 우선 · 가장 안정적</text>
  </g>

  <g transform="translate(40 282)" filter="url(#shadow)">
    <rect width="880" height="156" rx="18" fill="#fff"/>
    <text x="24" y="34" class="caption">OPTION 02</text>
    <text x="24" y="61" class="label">네픽 사선형</text>
    <text x="24" y="84" class="caption">포크 로고의 사선 리듬을 반영</text>
    <rect x="215" y="28" width="72" height="72" rx="18" fill="#FDECEA"/>
    <use href="#b-food" x="235" y="48" width="32" height="32" color="#D32F2F"/>
    <rect x="303" y="28" width="72" height="72" rx="18" fill="#F6F7F9"/>
    <use href="#b-cafe" x="323" y="48" width="32" height="32" color="#3A3F45"/>
    <g transform="translate(407 36)"><rect width="120" height="36" rx="18" fill="#D32F2F"/><use href="#b-food" x="14" y="8" width="20" height="20" color="#fff"/><text x="42" y="24" font-size="14" font-weight="700" fill="#fff">음식점</text></g>
    <g transform="translate(539 36)"><rect width="104" height="36" rx="18" fill="#fff" stroke="#E6E8EB" stroke-width="1.5"/><use href="#b-cafe" x="14" y="8" width="20" height="20" color="#3A3F45"/><text x="42" y="24" font-size="14" font-weight="600" fill="#3A3F45">카페</text></g>
    <use href="#b-food" x="700" y="39" width="24" height="24" color="#3A3F45"/><use href="#b-cafe" x="742" y="39" width="24" height="24" color="#3A3F45"/>
    <text x="700" y="91" class="caption">브랜드 개성 · 추천안</text>
  </g>

  <g transform="translate(40 456)" filter="url(#shadow)">
    <rect width="880" height="156" rx="18" fill="#fff"/>
    <text x="24" y="34" class="caption">OPTION 03</text>
    <text x="24" y="61" class="label">장소 핀형</text>
    <text x="24" y="84" class="caption">지도 서비스 성격을 강하게 표현</text>
    <rect x="215" y="28" width="72" height="72" rx="18" fill="#FDECEA"/>
    <use href="#c-food" x="235" y="48" width="32" height="32" color="#D32F2F"/>
    <rect x="303" y="28" width="72" height="72" rx="18" fill="#F6F7F9"/>
    <use href="#c-cafe" x="323" y="48" width="32" height="32" color="#3A3F45"/>
    <g transform="translate(407 36)"><rect width="120" height="36" rx="18" fill="#D32F2F"/><use href="#c-food" x="14" y="8" width="20" height="20" color="#fff"/><text x="42" y="24" font-size="14" font-weight="700" fill="#fff">음식점</text></g>
    <g transform="translate(539 36)"><rect width="104" height="36" rx="18" fill="#fff" stroke="#E6E8EB" stroke-width="1.5"/><use href="#c-cafe" x="14" y="8" width="20" height="20" color="#3A3F45"/><text x="42" y="24" font-size="14" font-weight="600" fill="#3A3F45">카페</text></g>
    <use href="#c-food" x="700" y="39" width="24" height="24" color="#3A3F45"/><use href="#c-cafe" x="742" y="39" width="24" height="24" color="#3A3F45"/>
