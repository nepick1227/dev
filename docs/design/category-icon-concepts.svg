  <rect width="960" height="680" fill="#F4F5F7"/>
  <text x="40" y="52" font-size="26" font-weight="800" letter-spacing="-0.5">네픽 음식점·카페 아이콘 시안</text>
  <text x="40" y="80" class="body">24px · 2.2px stroke · 라운드 캡 · 브랜드 레드 / 중성 먹색 대응</text>

  <g transform="translate(40 108)" filter="url(#shadow)">
    <rect width="880" height="156" rx="18" fill="#fff"/>
